<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video App</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Monetag -->
    <script
        src="//libtl.com/sdk.js"
        data-zone="11903209"
        data-sdk="show_11903209">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--tg-theme-bg-color, #0f1115);
            color: var(--tg-theme-text-color, #ffffff);
        }

        .app {
            max-width: 620px;
            margin: auto;
            padding: 16px;
        }

        .top {
            text-align: center;
            padding: 12px 0 20px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 5px;
        }

        .app-title {
            font-size: 24px;
            font-weight: 700;
        }

        .app-subtitle {
            margin-top: 5px;
            color: var(--tg-theme-hint-color, #8b929e);
            font-size: 14px;
        }

        .video-card {
            background: var(--tg-theme-secondary-bg-color, #191c22);
            border-radius: 18px;
            padding: 18px;
        }

        .video-icon {
            width: 100%;
            height: 150px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #20242c, #111318);
            font-size: 60px;
            margin-bottom: 18px;
        }

        .movie-title {
            font-size: 21px;
            font-weight: 700;
            line-height: 1.35;
            word-break: break-word;
        }

        .details {
            margin-top: 15px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 10px 0;
            border-bottom: 1px solid var(--tg-theme-hint-color, #555);
            font-size: 14px;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--tg-theme-hint-color, #8b929e);
        }

        .detail-value {
            text-align: right;
            font-weight: 600;
            word-break: break-word;
        }

        .download-section {
            margin-top: 20px;
            text-align: center;
        }

        .countdown {
            padding: 14px;
            border-radius: 14px;
            background: var(--tg-theme-bg-color, #101216);
            color: var(--tg-theme-hint-color, #8b929e);
            font-size: 14px;
        }

        .countdown-number {
            font-size: 26px;
            font-weight: 700;
            color: var(--tg-theme-text-color, #ffffff);
            margin-bottom: 4px;
        }

        .download-button {
            display: none;
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            border: none;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            text-align: center;
            font-size: 17px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
        }

        .download-button.visible {
            display: block;
        }

        .note {
            text-align: center;
            margin-top: 14px;
            color: var(--tg-theme-hint-color, #8b929e);
            font-size: 12px;
            line-height: 1.5;
        }

        .loading,
        .error {
            text-align: center;
            padding: 50px 15px;
        }

        .error {
            color: #ff6b6b;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: var(--tg-theme-hint-color, #8b929e);
            font-size: 11px;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="top">
        <div class="logo">🎬</div>

        <div class="app-title">
            Video App
        </div>

        <div class="app-subtitle">
            Watch & Download
        </div>
    </div>

    <div id="content">

        <div class="loading">
            ⏳
            <br><br>
            Loading video...
        </div>

    </div>

    <div class="footer">
        Powered by Telegram Mini App
    </div>

</div>


<script>

    /* ==========================================
       TELEGRAM MINI APP
    ========================================== */

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    /* ==========================================
       MAKE WEBHOOK
    ========================================== */

    const MAKE_WEBHOOK_URL =
        "https://hook.eu1.make.com/ud3xahsh42yybn9byb7pu8i7bzv7i4ra";


    /* ==========================================
       TELEGRAM BOT
    ========================================== */

    const BOT_USERNAME =
        "Aa_ishh_bot";


    /* ==========================================
       GET SHORT CODE
    ========================================== */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const shortCode =
        params.get("code");


    /* ==========================================
       STATE
    ========================================== */

    let videoLoaded = false;

    let adStarted = false;

    let countdownStarted = false;

    let countdownFinished = false;

    let countdownTimer = null;


    /* ==========================================
       LOAD VIDEO
    ========================================== */

    async function loadVideo() {

        const content =
            document.getElementById(
                "content"
            );


        if (!shortCode) {

            content.innerHTML = `
                <div class="error">
                    ❌
                    <br><br>
                    No video selected.
                    <br><br>
                    Please open the video
                    link from Telegram.
                </div>
            `;

            return;
        }


        try {

            const response =
                await fetch(
                    MAKE_WEBHOOK_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                short_code:
                                    shortCode
                            })
                    }
                );


            const responseText =
                await response.text();


            console.log(
                "Make response:",
                responseText
            );


            const data =
                JSON.parse(
                    responseText
                );


            if (
                data.success !== true
            ) {

                throw new Error(
                    "Video not found."
                );

            }


            const video =
                data.video ||
                (
                    Array.isArray(
                        data.videos
                    )
                        ? data.videos[0]
                        : null
                );


            if (!video) {

                throw new Error(
                    "Video not found."
                );

            }


            /* ==========================================
               VIDEO DETAILS
            ========================================== */

            const title =
                video.movie_name ||
                video.file_name ||
                "Untitled Video";


            const language =
                video.language ||
                "Unknown";


            const year =
                video.year ||
                "";


            const genre =
                video.genre ||
                "";


            const size =
                formatFileSize(
                    video.file_size
                );


            const quality =
                getQuality(
                    video.file_name,
                    video.caption
                );


            const actualCode =
                video.short_code ||
                shortCode;


            /* ==========================================
               TELEGRAM BOT DEEP LINK
            ========================================== */

            const botLink =
                "https://t.me/" +
                BOT_USERNAME +
                "?start=" +
                encodeURIComponent(
                    actualCode
                );


            console.log(
                "Telegram bot link:",
                botLink
            );


            /* ==========================================
               DISPLAY VIDEO
            ========================================== */

            content.innerHTML = `

                <div class="video-card">

                    <div class="video-icon">
                        🎞️
                    </div>


                    <div class="movie-title">
                        ${escapeHTML(title)}
                    </div>


                    <div class="details">

                        ${
                            year
                                ? `
                        <div class="detail-row">

                            <span class="detail-label">
                                📅 Year
                            </span>

                            <span class="detail-value">
                                ${escapeHTML(year)}
                            </span>

                        </div>
                        `
                                : ""
                        }


                        <div class="detail-row">

                            <span class="detail-label">
                                🌐 Language
                            </span>

                            <span class="detail-value">
                                ${escapeHTML(language)}
                            </span>

                        </div>


                        ${
                            quality
                                ? `
                        <div class="detail-row">

                            <span class="detail-label">
                                🎞️ Quality
                            </span>

                            <span class="detail-value">
                                ${escapeHTML(quality)}
                            </span>

                        </div>
                        `
                                : ""
                        }


                        ${
                            genre
                                ? `
                        <div class="detail-row">

                            <span class="detail-label">
                                🎭 Genre
                            </span>

                            <span class="detail-value">
                                ${escapeHTML(genre)}
                            </span>

                        </div>
                        `
                                : ""
                        }


                        <div class="detail-row">

                            <span class="detail-label">
                                💾 Size
                            </span>

                            <span class="detail-value">
                                ${escapeHTML(size)}
                            </span>

                        </div>

                    </div>


                    <div class="download-section">


                        <div
                            id="countdown"
                            class="countdown"
                        >

                            <div class="countdown-number">
                                Preparing...
                            </div>

                            Please wait

                        </div>


                        <button
                            id="downloadButton"
                            class="download-button"
                            type="button"
                        >

                            ⬇️ Download Video

                        </button>


                        <div class="note">

                            Your video will be sent
                            directly in Telegram.

                        </div>

                    </div>

                </div>

            `;


            /* ==========================================
               DOWNLOAD BUTTON
            ========================================== */

            const downloadButton =
                document.getElementById(
                    "downloadButton"
                );


            downloadButton.addEventListener(
                "click",
                function () {

                    console.log(
                        "Download button clicked"
                    );


                    /*
                     * Use Telegram's native
                     * Mini App method.
                     */

                    if (
                        window.Telegram &&
                        window.Telegram.WebApp &&
                        typeof
                        window.Telegram.WebApp
                            .openTelegramLink ===
                            "function"
                    ) {

                        console.log(
                            "Opening Telegram link using openTelegramLink"
                        );


                        window.Telegram.WebApp
                            .openTelegramLink(
                                botLink
                            );

                    } else {

                        /*
                         * Fallback for testing
                         * outside Telegram.
                         */

                        console.log(
                            "openTelegramLink unavailable, using normal navigation"
                        );


                        window.location.href =
                            botLink;

                    }

                }
            );


            videoLoaded = true;


            /* ==========================================
               START AD AFTER 3 SECONDS
            ========================================== */

            setTimeout(
                startAd,
                3000
            );

        }

        catch (error) {

            console.error(
                error
            );


            content.innerHTML = `

                <div class="error">

                    ❌
                    <br><br>

                    ${escapeHTML(
                        error.message ||
                        "Unable to load video."
                    )}

                </div>

            `;

        }

    }


    /* ==========================================
       START MONETAG AD
    ========================================== */

    function startAd() {

        if (adStarted) {
            return;
        }


        adStarted = true;


        console.log(
            "Starting Monetag ad..."
        );


        try {

            if (
                typeof show_11903209 ===
                "function"
            ) {

                show_11903209({

                    type: "inApp",

                    inAppSettings: {

                        frequency: 2,

                        capping: 0.1,

                        interval: 30,

                        timeout: 5,

                        everyPage: false

                    }

                });

            }

            else {

                console.log(
                    "Monetag SDK unavailable."
                );

                startCountdown();

            }

        }

        catch (error) {

            console.log(
                "Monetag error:",
                error
            );

            startCountdown();

        }


        /*
         * Wait for the user to return
         * from the advertisement.
         */

        waitForAdReturn();

    }


    /* ==========================================
       WAIT FOR AD RETURN
    ========================================== */

    function waitForAdReturn() {

        let returned = false;


        function checkReturn() {

            if (returned) {
                return;
            }


            if (
                document.visibilityState ===
                "visible"
            ) {

                setTimeout(
                    function () {

                        if (
                            document.visibilityState ===
                            "visible"
                        ) {

                            returned = true;


                            document.removeEventListener(
                                "visibilitychange",
                                checkReturn
                            );


                            console.log(
                                "Returned from ad."
                            );


                            startCountdown();

                        }

                    },
                    500
                );

            }

        }


        document.addEventListener(
            "visibilitychange",
            checkReturn
        );


        /*
         * Fallback.
         *
         * If the ad doesn't trigger a
         * visibility change, don't leave
         * the user stuck forever.
         */

        setTimeout(
            function () {

                if (!returned) {

                    returned = true;


                    document.removeEventListener(
                        "visibilitychange",
                        checkReturn
                    );


                    console.log(
                        "Ad return fallback triggered."
                    );


                    startCountdown();

                }

            },
            8000
        );

    }


/* ==========================================
   5 SECOND COUNTDOWN
========================================== */

function startCountdown() {

    if (
        countdownStarted ||
        countdownFinished
    ) {
        return;
    }

    countdownStarted = true;

    const countdown =
        document.getElementById(
            "countdown"
        );

    const downloadButton =
        document.getElementById(
            "downloadButton"
        );

    if (
        !countdown ||
        !downloadButton
    ) {
        return;
    }

    let seconds = 5;

    countdown.innerHTML = `
        <div class="countdown-number">
            ${seconds}
        </div>

        Preparing your download...
    `;

    countdownTimer =
        setInterval(
            function () {

                seconds--;

                if (seconds > 0) {

                    countdown.innerHTML = `
                        <div class="countdown-number">
                            ${seconds}
                        </div>

                        Preparing your download...
                    `;

                } else {

                    clearInterval(
                        countdownTimer
                    );

                    countdownFinished = true;

                    countdown.style.display =
                        "none";

                    downloadButton.classList.add(
                        "visible"
                    );

                    console.log(
                        "Download button enabled."
                    );
                }

            },
            1000
        );
}


/* ==========================================
   FILE SIZE
========================================== */

function formatFileSize(bytes) {

    if (
        bytes === null ||
        bytes === undefined ||
        bytes === "" ||
        isNaN(bytes)
    ) {
        return "Unknown";
    }

    bytes = Number(bytes);

    if (
        bytes >=
        1024 * 1024 * 1024
    ) {

        return (
            bytes /
            (1024 * 1024 * 1024)
        ).toFixed(2) + " GB";

    }

    if (
        bytes >=
        1024 * 1024
    ) {

        return (
            bytes /
            (1024 * 1024)
        ).toFixed(2) + " MB";

    }

    if (
        bytes >=
        1024
    ) {

        return (
            bytes /
            1024
        ).toFixed(2) + " KB";

    }

    return bytes + " B";
}


/* ==========================================
   DETECT QUALITY
========================================== */

function getQuality(
    fileName,
    caption
) {

    const text =
        (
            (fileName || "") +
            " " +
            (caption || "")
        ).toLowerCase();

    const qualities = [
        "2160p",
        "4k",
        "1080p",
        "720p",
        "480p",
        "360p"
    ];

    for (
        const quality
        of qualities
    ) {

        if (
            text.includes(
                quality
            )
        ) {

            return quality;

        }

    }

    return "";
}


/* ==========================================
   HTML ESCAPE
========================================== */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* ==========================================
   START APP
========================================== */

loadVideo();
