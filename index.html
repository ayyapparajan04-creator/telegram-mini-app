<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Video Download</title>

    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- MONETAG SDK -->
    <script
        src="//libtl.com/sdk.js"
        data-zone="11903209"
        data-sdk="show_11903209">
    </script>

    <!-- MONETAG IN-APP INTERSTITIAL -->
    <script>
        show_11903209({
            type: 'inApp',
            inAppSettings: {
                frequency: 2,
                capping: 0.1,
                interval: 30,
                timeout: 5,
                everyPage: false
            }
        });
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #111827;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        .card {
            background: #1f2937;
            border-radius: 16px;
            padding: 20px;
        }

        .title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .movie-title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 18px;
            word-break: break-word;
        }

        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .info-item {
            background: #374151;
            border-radius: 10px;
            padding: 12px;
        }

        .label {
            color: #9ca3af;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .value {
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            word-break: break-word;
        }

        .countdown {
            text-align: center;
            margin-top: 25px;
            min-height: 22px;
            font-size: 15px;
            color: #d1d5db;
        }

        #downloadBtn {
            display: none;
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #22c55e;
            color: #ffffff;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #downloadBtn:active {
            transform: scale(0.98);
        }

        .error {
            display: none;
            margin-top: 20px;
            padding: 14px;
            background: #7f1d1d;
            border-radius: 10px;
            color: #fecaca;
            text-align: center;
        }

        @media (max-width: 400px) {
            .container {
                padding: 14px;
            }

            .info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <div class="title">
            Video Download
        </div>

        <div id="movieTitle" class="movie-title">
            Loading...
        </div>

        <div class="info">

            <div class="info-item">
                <div class="label">Size</div>
                <div id="fileSize" class="value">-</div>
            </div>

            <div class="info-item">
                <div class="label">Language</div>
                <div id="language" class="value">-</div>
            </div>

            <div class="info-item">
                <div class="label">Quality</div>
                <div id="quality" class="value">-</div>
            </div>

            <div class="info-item">
                <div class="label">Year</div>
                <div id="year" class="value">-</div>
            </div>

            <div class="info-item">
                <div class="label">Genre</div>
                <div id="genre" class="value">-</div>
            </div>

        </div>

        <div id="countdown" class="countdown"></div>

        <button id="downloadBtn" type="button">
            Download
        </button>

        <div id="errorMessage" class="error"></div>

    </div>
</div>

<script>
    const MAKE_WEBHOOK =
        "https://hook.eu1.make.com/ud3xahsh42yybn9byb7pu8i7bzv7i4ra";

    const BOT_USERNAME = "Aa_ishh_bot";


    /* Telegram */
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }


    /* Elements */
    const movieTitle = document.getElementById("movieTitle");
    const fileSize = document.getElementById("fileSize");
    const language = document.getElementById("language");
    const quality = document.getElementById("quality");
    const year = document.getElementById("year");
    const genre = document.getElementById("genre");
    const countdown = document.getElementById("countdown");
    const downloadBtn = document.getElementById("downloadBtn");
    const errorMessage = document.getElementById("errorMessage");


    /* URL code */
    const params = new URLSearchParams(window.location.search);

    const shortCode = params.get("code");

    let actualCode = shortCode;


    /*
     * Start the 5-second download countdown
     * immediately when the page opens.
     *
     * IMPORTANT:
     * This timer has NOTHING to do with Monetag.
     */
    function startDownloadTimer() {

        let seconds = 5;

        countdown.textContent =
            "Download available in " + seconds + " seconds";

        const timer = setInterval(function () {

            seconds--;

            if (seconds > 0) {

                countdown.textContent =
                    "Download available in " + seconds + " seconds";

            } else {

                clearInterval(timer);

                countdown.textContent = "";

                downloadBtn.style.display = "block";
            }

        }, 1000);
    }


    /*
     * Start countdown immediately on page entry.
     */
    startDownloadTimer();


    /* Clean values */
    function cleanValue(value) {

        if (value === undefined || value === null) {
            return "";
        }

        if (typeof value === "string") {

            const cleaned = value.trim();

            if (
                cleaned === "" ||
                cleaned.toLowerCase() === "null" ||
                cleaned.toLowerCase() === "undefined"
            ) {
                return "";
            }

            return cleaned;
        }

        return String(value);
    }


    /* Get field from Make response */
    function getField(object, fields) {

        if (!object || typeof object !== "object") {
            return "";
        }

        for (const field of fields) {

            if (
                Object.prototype.hasOwnProperty.call(
                    object,
                    field
                )
            ) {

                const value = cleanValue(object[field]);

                if (value !== "") {
                    return value;
                }
            }
        }


        /* Case-insensitive fallback */

        const keys = Object.keys(object);

        for (const wanted of fields) {

            const found = keys.find(
                key =>
                    key.toLowerCase() ===
                    wanted.toLowerCase()
            );

            if (found) {

                const value =
                    cleanValue(object[found]);

                if (value !== "") {
                    return value;
                }
            }
        }

        return "";
    }


    /*
     * Format file size if Make/Neon returns
     * the value as bytes.
     *
     * If the value already contains MB/GB/etc.,
     * it is preserved.
     */
    function formatFileSize(value) {

        if (
            value === undefined ||
            value === null ||
            value === ""
        ) {
            return "-";
        }


        /* Object response fallback */
        if (typeof value === "object") {

            const possible =
                value.value ??
                value.formatted ??
                value.size ??
                value.file_size;

            if (
                possible !== undefined &&
                possible !== null
            ) {
                value = possible;
            } else {
                return "-";
            }
        }


        const text = String(value).trim();


        /* Already formatted */
        if (
            /kb|mb|gb|tb|bytes?/i.test(text)
        ) {
            return text;
        }


        /* Numeric bytes */
        const bytes = Number(
            text.replace(/,/g, "")
        );

        if (
            Number.isFinite(bytes) &&
            bytes > 0
        ) {

            const units = [
                "B",
                "KB",
                "MB",
                "GB",
                "TB"
            ];

            let size = bytes;
            let index = 0;

            while (
                size >= 1024 &&
                index < units.length - 1
            ) {
                size /= 1024;
                index++;
            }

            return (
                size.toFixed(index === 0 ? 0 : 2)
                .replace(/\.00$/, "") +
                " " +
                units[index]
            );
        }


        return text || "-";
    }


    /* Get file size */
    function getFileSize(video) {

        let size = getField(video, [
            "file_size",
            "fileSize",
            "filesize",
            "size",
            "Size"
        ]);


        /* Check nested video object */
        if (!size && video.video) {

            size = getField(video.video, [
                "file_size",
                "fileSize",
                "filesize",
                "size"
            ]);
        }


        return formatFileSize(size);
    }


    /* Display video */
    function displayVideo(video) {

        if (!video) {

            showError("Video not found.");

            return;
        }


        /* Movie */
        const title = getField(video, [
            "movie_name",
            "movieName",
            "movie",
            "title",
            "file_name",
            "fileName"
        ]);

        movieTitle.textContent =
            title || "Video Download";


        /* Size */
        fileSize.textContent =
            getFileSize(video);


        /* Language */
        const lang = getField(video, [
            "language",
            "lang",
            "movie_language",
            "audio_language",
            "audioLanguage"
        ]);

        language.textContent =
            lang || "-";


        /* Quality */
        let videoQuality = getField(video, [
            "quality",
            "video_quality",
            "videoQuality",
            "resolution"
        ]);


        /* Quality fallback from caption */
        if (!videoQuality) {

            const caption =
                getField(video, ["caption"]);

            if (caption) {

                const match = caption.match(
                    /\b(4K|2160p|1440p|1080p|720p|480p|360p|HD|FHD|WEB-DL|WEBRip|BluRay)\b/i
                );

                if (match) {
                    videoQuality = match[1];
                }
            }
        }


        quality.textContent =
            videoQuality || "-";


        /* Year */
        const videoYear = getField(video, [
            "year",
            "release_year",
            "releaseYear"
        ]);

        year.textContent =
            videoYear || "-";


        /* Genre */
        const videoGenre = getField(video, [
            "genre",
            "genres"
        ]);

        genre.textContent =
            videoGenre || "-";


        /* Returned short code */
        const returnedCode = getField(video, [
            "short_code",
            "shortCode",
            "code"
        ]);

        if (returnedCode) {
            actualCode = returnedCode;
        }
    }


    /* Error */
    function showError(message) {

        errorMessage.textContent = message;

        errorMessage.style.display = "block";

        movieTitle.textContent =
            "Video Download";

        downloadBtn.style.display = "none";
    }

<script>

    /*
     * Load video information from Make.com
     *
     * NOTE:
     * The 5-second timer is NOT here.
     * It already started when the page opened.
     *
     * Monetag is also completely independent.
     */
    async function loadVideo() {

        if (!shortCode) {

            showError(
                "No video code was provided."
            );

            return;
        }


        try {

            const response = await fetch(
                MAKE_WEBHOOK,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        short_code: shortCode
                    })
                }
            );


            if (!response.ok) {
                throw new Error(
                    "Request failed"
                );
            }


            const text =
                await response.text();


            let data;


            try {

                data = JSON.parse(text);

            } catch (error) {

                throw new Error(
                    "Invalid response"
                );
            }


            /*
             * Support the different response
             * structures that Make may return.
             */

            let video = null;


            if (
                data &&
                data.video &&
                typeof data.video === "object"
            ) {

                video = data.video;

            } else if (
                data &&
                Array.isArray(data.videos) &&
                data.videos.length
            ) {

                video = data.videos[0];

            } else if (
                data &&
                Array.isArray(data.data) &&
                data.data.length
            ) {

                video = data.data[0];

            } else if (
                data &&
                typeof data === "object"
            ) {

                video = data;
            }


            if (!video) {

                showError(
                    "Video not found."
                );

                return;
            }


            displayVideo(video);


        } catch (error) {

            console.error(
                "Video loading error:",
                error
            );

            showError(
                "Unable to load the video."
            );
        }
    }


    /*
     * Download button
     *
     * This only opens the Telegram bot.
     * It does NOT call Monetag.
     */
    downloadBtn.addEventListener(
        "click",
        function () {

            if (!actualCode) {
                return;
            }


            const botLink =
                "https://t.me/" +
                BOT_USERNAME +
                "?start=" +
                encodeURIComponent(actualCode);


            if (
                window.Telegram &&
                window.Telegram.WebApp &&
                typeof window.Telegram.WebApp
                    .openTelegramLink === "function"
            ) {

                window.Telegram.WebApp
                    .openTelegramLink(botLink);

            } else {

                window.location.href =
                    botLink;
            }
        }
    );


    /*
     * Load the video.
     *
     * The Monetag function has already been
     * called separately in <head>.
     */
    loadVideo();

</script>

</body>
</html>
