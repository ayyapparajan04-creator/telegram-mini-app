<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Video App</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Monetag -->
    <script
        src="//libtl.com/sdk.js"
        data-zone="11903209"
        data-sdk="show_11903209">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #111111);
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 50px;
        }

        h1 {
            margin: 8px 0;
            font-size: 24px;
        }

        .subtitle {
            color: var(--tg-theme-hint-color, #777777);
            font-size: 14px;
        }

        .card {
            padding: 20px;
            border-radius: 16px;
            background: var(
                --tg-theme-secondary-bg-color,
                #f2f2f2
            );
            margin-top: 15px;
        }

        .label {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #777777);
            margin-bottom: 6px;
        }

        .value {
            font-size: 16px;
            font-weight: bold;
            word-break: break-word;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: var(
                --tg-theme-secondary-bg-color,
                #f2f2f2
            );
            text-align: center;
        }

        .success {
            color: #16803c;
        }

        .error {
            color: #d33;
        }

        .loading {
            text-align: center;
            padding: 30px 10px;
            color: var(--tg-theme-hint-color, #777777);
        }

        .code {
            font-family: monospace;
            font-size: 18px;
            word-break: break-all;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">🎬</div>

        <h1>My Video App</h1>

        <div class="subtitle">
            Specific Video Test
        </div>

    </div>


    <div id="content">

        <div class="loading">
            Connecting to Make.com...
        </div>

    </div>

</div>


<script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    /*
        YOUR EXISTING MAKE.COM WEBHOOK
    */

    const MAKE_WEBHOOK_URL =
        "https://hook.eu1.make.com/ud3xahsh42yybn9byb7pu8i7bzv7i4ra";


    /*
        TEMPORARY TEST CODE

        We are testing with one specific video.

        Later this will automatically come from:

        ?code=dae2c6ce
    */

    const TEST_SHORT_CODE = "dae2c6ce";


    async function loadSpecificVideo() {

        const content = document.getElementById("content");


        try {

            /*
                Send ONLY the short code to Make.com.
            */

            const response = await fetch(MAKE_WEBHOOK_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    short_code: TEST_SHORT_CODE
                })

            });


            /*
                Read Make.com's response.
            */

            const responseText = await response.text();

            console.log(
                "Make.com response:",
                responseText
            );


            /*
                Try to parse JSON.
            */

            let data;

            try {

                data = JSON.parse(responseText);

            } catch (error) {

                throw new Error(
                    "Make.com returned invalid JSON."
                );

            }


            /*
                Display the response we received.
            */

            if (data.success === true) {

                const video = data.video || data.videos?.[0];


                if (!video) {

                    content.innerHTML = `
                        <div class="status error">
                            ❌ No video was returned.
                        </div>
                    `;

                    return;
                }


                const title =
                    video.movie_name ||
                    video.file_name ||
                    "Untitled Video";


                content.innerHTML = `

                    <div class="card">

                        <div class="label">
                            Video
                        </div>

                        <div class="value">
                            ${escapeHTML(title)}
                        </div>

                    </div>


                    <div class="card">

                        <div class="label">
                            Short Code
                        </div>

                        <div class="value code">
                            ${escapeHTML(
                                video.short_code || TEST_SHORT_CODE
                            )}
                        </div>

                    </div>


                    <div class="card">

                        <div class="label">
                            File Size
                        </div>

                        <div class="value">
                            ${formatFileSize(video.file_size)}
                        </div>

                    </div>


                    <div class="card">

                        <div class="label">
                            Language
                        </div>

                        <div class="value">
                            ${escapeHTML(
                                video.language || "Not specified"
                            )}
                        </div>

                    </div>


                    <div class="status success">

                        ✅ Specific video loaded

                    </div>

                `;


                /*
                    Monetag ad
                */

                setTimeout(() => {

                    try {

                        if (
                            typeof show_11903209 ===
                            "function"
                        ) {

                            show_11903209({

                                type: "inApp",

                                inAppSettings: {

                                    frequency: 2,

                                    capping: 0.1,

                                    interval: 30,

                                    timeout: 5,

                                    everyPage: false

                                }

                            });

                        }

                    } catch (adError) {

                        console.log(
                            "Monetag error:",
                            adError
                        );

                    }

                }, 1000);


            } else {

                content.innerHTML = `

                    <div class="status error">

                        ❌ Make.com did not return
                        success: true.

                    </div>

                `;

                console.log(
                    "Make data:",
                    data
                );

            }

        } catch (error) {

            console.error(error);


            content.innerHTML = `

                <div class="status error">

                    ❌ Unable to connect to Make.com.

                    <br><br>

                    ${escapeHTML(error.message)}

                </div>

            `;

        }

    }


    function formatFileSize(bytes) {

        if (
            bytes === null ||
            bytes === undefined ||
            bytes === "" ||
            isNaN(bytes)
        ) {

            return "Unknown";

        }


        bytes = Number(bytes);


        if (
            bytes >=
            1024 * 1024 * 1024
        ) {

            return (
                bytes /
                (1024 * 1024 * 1024)
            ).toFixed(2) + " GB";

        }


        if (
            bytes >=
            1024 * 1024
        ) {

            return (
                bytes /
                (1024 * 1024)
            ).toFixed(2) + " MB";

        }


        if (
            bytes >=
            1024
        ) {

            return (
                bytes /
                1024
            ).toFixed(2) + " KB";

        }


        return bytes + " B";

    }


    function escapeHTML(value) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    /*
        Start the test.
    */

    loadSpecificVideo();

</script>

</body>
</html>
```
