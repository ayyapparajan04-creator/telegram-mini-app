<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Video App</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Monetag -->
    <script
        src="//libtl.com/sdk.js"
        data-zone="11903209"
        data-sdk="show_11903209">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 18px;
            font-family: Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #111111);
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 48px;
        }

        h1 {
            margin: 6px 0;
            font-size: 24px;
        }

        .subtitle {
            color: var(--tg-theme-hint-color, #777777);
            font-size: 14px;
        }

        .card {
            background: var(
                --tg-theme-secondary-bg-color,
                #f2f2f2
            );

            border-radius: 16px;
            padding: 18px;
            margin-top: 14px;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.4;
            word-break: break-word;
        }

        .info {
            margin-top: 12px;
            color: var(--tg-theme-hint-color, #777777);
            font-size: 14px;
            line-height: 1.8;
        }

        .download-btn {
            display: block;
            width: 100%;
            margin-top: 18px;
            padding: 14px;
            border-radius: 13px;

            background: var(
                --tg-theme-button-color,
                #2481cc
            );

            color: var(
                --tg-theme-button-text-color,
                #ffffff
            );

            text-decoration: none;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
        }

        .status {
            text-align: center;
            padding: 25px 10px;
            color: var(--tg-theme-hint-color, #777777);
        }

        .error {
            color: #d33;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">🎬</div>

        <h1>My Video App</h1>

        <div class="subtitle">
            Your requested video
        </div>

    </div>

    <div id="content">

        <div class="status">
            Loading video...
        </div>

    </div>

</div>


<script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    /*
        YOUR MAKE.COM WEBHOOK
    */

    const MAKE_WEBHOOK_URL =
        "https://hook.eu1.make.com/ud3xahsh42yybn9byb7pu8i7bzv7i4ra";


    /*
        YOUR TELEGRAM BOT

        The bot username is:
        @Aa_ishh_bot
    */

    const BOT_USERNAME = "Aa_ishh_bot";


    /*
        READ THE CODE FROM THE URL

        Example:

        ?code=dae2c6ce

        becomes:

        dae2c6ce
    */

    const urlParams = new URLSearchParams(
        window.location.search
    );

    const shortCode = urlParams.get("code");


    async function loadSpecificVideo() {

        const content =
            document.getElementById("content");


        /*
            Make sure a code was supplied.
        */

        if (!shortCode) {

            content.innerHTML = `
                <div class="status error">
                    ❌ No video code was provided.
                </div>
            `;

            return;
        }


        try {

            /*
                Send the specific short code
                to Make.com.
            */

            const response = await fetch(
                MAKE_WEBHOOK_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        short_code: shortCode
                    })
                }
            );


            const responseText =
                await response.text();


            console.log(
                "Make response:",
                responseText
            );


            let data;


            try {

                data =
                    JSON.parse(responseText);

            } catch (error) {

                throw new Error(
                    "Invalid response from Make.com."
                );

            }


            /*
                Make must return success.
            */

            if (data.success !== true) {

                throw new Error(
                    "Video was not found."
                );

            }


            /*
                Support either:
                data.video
                OR
                data.videos[0]
            */

            const video =
                data.video ||
                (
                    Array.isArray(data.videos)
                        ? data.videos[0]
                        : null
                );


            if (!video) {

                throw new Error(
                    "No video was found for this code."
                );

            }


            const title =
                video.movie_name ||
                video.file_name ||
                "Untitled Video";


            const language =
                video.language ||
                "Not specified";


            const year =
                video.year ||
                "";


            const genre =
                video.genre ||
                "";


            const size =
                formatFileSize(
                    video.file_size
                );


            /*
                Telegram deep link.

                Example:

                https://t.me/Aa_ishh_bot?start=dae2c6ce
            */

            const botLink =
                "https://t.me/" +
                BOT_USERNAME +
                "?start=" +
                encodeURIComponent(
                    video.short_code ||
                    shortCode
                );


            /*
                Display ONLY this video.
            */

            content.innerHTML = `

                <div class="card">

                    <div class="title">
                        ${escapeHTML(title)}
                    </div>

                    <div class="info">

                        ${year
                            ? `📅 ${escapeHTML(year)}<br>`
                            : ""
                        }

                        🌐 ${escapeHTML(language)}
                        <br>

                        💾 ${escapeHTML(size)}

                        ${genre
                            ? `<br>🎭 ${escapeHTML(genre)}`
                            : ""
                        }

                    </div>


                    <a
                        class="download-btn"
                        href="${botLink}"
                    >
                        ⬇️ Download
                    </a>

                </div>

            `;


            /*
                Show Monetag ad after
                the video has loaded.
            */

            setTimeout(() => {

                try {

                    if (
                        typeof show_11903209 ===
                        "function"
                    ) {

                        show_11903209({

                            type: "inApp",

                            inAppSettings: {

                                frequency: 2,

                                capping: 0.1,

                                interval: 30,

                                timeout: 5,

                                everyPage: false

                            }

                        });

                    }

                } catch (error) {

                    console.log(
                        "Monetag error:",
                        error
                    );

                }

            }, 1000);


        } catch (error) {

            console.error(error);


            content.innerHTML = `

                <div class="status error">

                    ❌ ${escapeHTML(
                        error.message
                    )}

                </div>

            `;

        }

    }


    function formatFileSize(bytes) {

        if (
            bytes === null ||
            bytes === undefined ||
            bytes === "" ||
            isNaN(bytes)
        ) {

            return "Unknown";

        }


        bytes = Number(bytes);


        if (
            bytes >=
            1024 * 1024 * 1024
        ) {

            return (
                bytes /
                (1024 * 1024 * 1024)
            ).toFixed(2) + " GB";

        }


        if (
            bytes >=
            1024 * 1024
        ) {

            return (
                bytes /
                (1024 * 1024)
            ).toFixed(2) + " MB";

        }


        if (
            bytes >=
            1024
        ) {

            return (
                bytes /
                1024
            ).toFixed(2) + " KB";

        }


        return bytes + " B";

    }


    function escapeHTML(value) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    /*
        Start loading.
    */

    loadSpecificVideo();

</script>

</body>

</html>
