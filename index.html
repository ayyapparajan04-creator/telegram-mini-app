<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Video App</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Monetag Tag -->
    <script src='//libtl.com/sdk.js' data-zone='11903209' data-sdk='show_11903209'></script>
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 18px;
        }

        .header {
            text-align: center;
            padding: 20px 0 10px;
        }

        .logo {
            font-size: 55px;
        }

        h1 {
            margin: 8px 0 5px;
            font-size: 25px;
        }

        .subtitle {
            color: var(--tg-theme-hint-color, #777777);
            margin: 0;
        }

        .search-box {
            width: 100%;
            padding: 14px 16px;
            margin: 20px 0;
            border: none;
            border-radius: 14px;
            background: var(--tg-theme-secondary-bg-color, #f1f1f1);
            color: var(--tg-theme-text-color, #000000);
            font-size: 16px;
            outline: none;
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
        }

        #status {
            text-align: center;
            padding: 20px 10px;
            color: var(--tg-theme-hint-color, #777777);
        }

        .video-card {
            background: var(--tg-theme-secondary-bg-color, #f3f3f3);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .video-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .video-info {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #777777);
            line-height: 1.6;
        }

        .watch-button {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 16px;
            border-radius: 10px;
            background: #2481cc;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .error {
            color: #d93025;
            background: #ffecec;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            font-size: 14px;
            word-break: break-word;
        }

        .count {
            color: var(--tg-theme-hint-color, #777777);
            font-size: 13px;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">🎬</div>
        <h1>My Video App</h1>
        <p class="subtitle">Telegram Mini App</p>
    </div>

    <input
        type="text"
        id="searchInput"
        class="search-box"
        placeholder="🔎 Search videos..."
    >

    <div class="section-title">
        Latest Videos
    </div>

    <div id="count" class="count"></div>

    <div id="status">
        ⏳ Loading videos...
    </div>

    <div id="videoList"></div>

</div>

<script>

    // ==========================================
    // TELEGRAM
    // ==========================================

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    // ==========================================
    // MAKE.COM WEBHOOK
    // ==========================================

    const MAKE_WEBHOOK_URL = "https://hook.eu1.make.com/ud3xahsh42yybn9byb7pu8i7bzv7i4ra";


    // ==========================================
    // VARIABLES
    // ==========================================

    let allVideos = [];


    // ==========================================
    // LOAD VIDEOS
    // ==========================================

    async function loadVideos() {

        const status = document.getElementById("status");

        status.innerHTML = "⏳ Loading videos...";

        try {

            const telegramUser =
                tg.initDataUnsafe &&
                tg.initDataUnsafe.user
                    ? tg.initDataUnsafe.user
                    : null;


            const response = await fetch(MAKE_WEBHOOK_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    source: "telegram_mini_app",

                    telegram_user: telegramUser

                })

            });


            console.log("HTTP status:", response.status);


            if (!response.ok) {

                throw new Error(
                    "Make.com returned HTTP " + response.status
                );

            }


            // Read as TEXT first.
            // This is more reliable for debugging Make responses.

            const responseText = await response.text();

            console.log("Raw Make response:");
            console.log(responseText);


            if (!responseText) {

                throw new Error(
                    "Make.com returned an empty response."
                );

            }


            // Parse JSON manually

            let data;

            try {

                data = JSON.parse(responseText);

            } catch (parseError) {

                console.error(
                    "JSON parsing error:",
                    parseError
                );

                throw new Error(
                    "Make returned invalid JSON."
                );

            }


            console.log("Parsed Make data:");
            console.log(data);


            // Check success

            if (data.success !== true) {

                throw new Error(
                    "Make.com response success was not true."
                );

            }


            // Check videos

            if (!Array.isArray(data.videos)) {

                throw new Error(
                    "The videos field is not an array."
                );

            }


            allVideos = data.videos;


            console.log(
                "Videos received:",
                allVideos.length
            );


            status.innerHTML = "";


            renderVideos(allVideos);


        } catch (error) {

            console.error(
                "Mini App error:",
                error
            );


            status.innerHTML = `
                <div class="error">
                    ❌ Unable to load videos.<br><br>
                    ${escapeHTML(error.message)}
                </div>
            `;

        }

    }


    // ==========================================
    // RENDER VIDEOS
    // ==========================================

    function renderVideos(videos) {

        const videoList =
            document.getElementById("videoList");

        const count =
            document.getElementById("count");


        videoList.innerHTML = "";


        count.textContent =
            videos.length +
            (videos.length === 1 ? " video" : " videos");


        if (videos.length === 0) {

            videoList.innerHTML = `
                <div id="status">
                    No videos found.
                </div>
            `;

            return;

        }


        videos.forEach(video => {

            const card =
                document.createElement("div");

            card.className = "video-card";


            // Prefer movie_name.
            // If empty, use file_name.

            const title =
                video.movie_name ||
                video.file_name ||
                "Untitled Video";


            const year =
                video.year || "";


            const language =
                video.language || "";


            const genre =
                video.genre || "";


            const fileSize =
                video.file_size || "";


            let info = "";


            if (year) {

                info += "📅 " +
                    escapeHTML(String(year)) +
                    "<br>";

            }


            if (language) {

                info += "🌐 " +
                    escapeHTML(String(language)) +
                    "<br>";

            }


            if (genre) {

                info += "🎭 " +
                    escapeHTML(String(genre)) +
                    "<br>";

            }


            if (fileSize) {

                info += "💾 " +
                    escapeHTML(String(fileSize));

            }


            card.innerHTML = `

                <div class="video-title">
                    ${escapeHTML(String(title))}
                </div>

                <div class="video-info">
                    ${info || "Video content"}
                </div>

            `;


            videoList.appendChild(card);

        });

    }


    // ==========================================
    // SEARCH
    // ==========================================

    document
        .getElementById("searchInput")
        .addEventListener("input", function () {

            const search =
                this.value
                    .toLowerCase()
                    .trim();


            if (!search) {

                renderVideos(allVideos);

                return;

            }


            const filtered =
                allVideos.filter(video => {

                    const text = [

                        video.movie_name,
                        video.file_name,
                        video.language,
                        video.genre,
                        video.year,
                        video.caption

                    ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();


                    return text.includes(search);

                });


            renderVideos(filtered);

        });


    // ==========================================
    // HTML ESCAPE
    // ==========================================

    function escapeHTML(value) {

        return value
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // ==========================================
    // MONETAG IN-APP INTERSTITIAL
    // ==========================================

    function showMonetagAd() {

        if (typeof show_11903209 === "function") {

            show_11903209({

                type: "inApp",

                inAppSettings: {

                    frequency: 2,

                    capping: 0.1,

                    interval: 30,

                    timeout: 5,

                    everyPage: false

                }

            });

        }

    }


    // ==========================================
    // START
    // ==========================================

    loadVideos();

</script>

</body>
</html>
