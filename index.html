<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Download</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #1f2937;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    h1 {
      margin-top: 0;
      font-size: 25px;
    }

    .movie-name {
      font-size: 21px;
      font-weight: bold;
      margin: 15px 0;
    }

    .details {
      text-align: left;
      background: #111827;
      border-radius: 12px;
      padding: 15px;
      margin: 18px 0;
      line-height: 1.7;
      font-size: 14px;
    }

    .instructions {
      text-align: left;
      background: #374151;
      border-radius: 12px;
      padding: 15px;
      margin-top: 18px;
      line-height: 1.6;
      font-size: 14px;
    }

    .timer {
      font-size: 32px;
      font-weight: bold;
      margin: 25px 0 15px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    button:disabled {
      background: #4b5563;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      font-size: 14px;
      color: #d1d5db;
    }

    .error {
      color: #fca5a5;
      line-height: 1.6;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎬 Video Download</h1>

    <div id="loading">
      Loading video...
    </div>

    <div id="content" class="hidden">

      <div id="movieName" class="movie-name"></div>

      <div id="details" class="details"></div>

      <div class="instructions">
        <strong>📥 Download Instructions</strong>
        <br><br>
        1. Wait for the 10-second timer to finish.
        <br>
        2. Tap the Download button.
        <br>
        3. Telegram will open.
        <br>
        4. Start the bot to receive your requested video.
      </div>

      <div id="timer" class="timer">
        10
      </div>

      <button id="downloadButton" disabled>
        Please wait...
      </button>

      <div id="status" class="status"></div>

    </div>

    <div id="error" class="error hidden"></div>

  </div>

  <script>
    const WEBHOOK_URL =
      "https://hook.eu1.make.com/ud3xahsh42yybn9byb7pu8i7bzv7i4ra";

    const BOT_USERNAME = "Aa_ishh_bot";

    const params = new URLSearchParams(window.location.search);

    // IMPORTANT:
    // Read the exact short code from this URL.
    const shortCode = params.get("code");

    const loading = document.getElementById("loading");
    const content = document.getElementById("content");
    const errorBox = document.getElementById("error");

    const movieName = document.getElementById("movieName");
    const details = document.getElementById("details");

    const timerElement = document.getElementById("timer");
    const downloadButton = document.getElementById("downloadButton");
    const statusElement = document.getElementById("status");

    let countdown = 10;

    function showError(message) {
      loading.classList.add("hidden");
      content.classList.add("hidden");
      errorBox.classList.remove("hidden");
      errorBox.textContent = message;
    }

    async function loadVideo() {

      if (!shortCode) {
        showError("No video code was found in this URL.");
        return;
      }

      try {

        /*
          Send ONLY the exact short_code from the URL.

          Example:
          ?code=ABC123

          Make receives:
          {
            short_code: "ABC123"
          }
        */

        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            short_code: shortCode
          })
        });

        if (!response.ok) {
          throw new Error("Unable to load video information.");
        }

        const data = await response.json();

        console.log("URL short code:", shortCode);
        console.log("Make response:", data);

        /*
          Handle either a single object or an array.
        */

        const video = Array.isArray(data)
          ? data[0]
          : data;

        if (!video) {
          throw new Error("No video was found for this code.");
        }

        movieName.textContent =
          video.movie_name || video.file_name || "Video";

        let html = "";

        if (video.file_name) {
          html += "<strong>File:</strong> " +
            escapeHtml(video.file_name) + "<br>";
        }

        if (video.year) {
          html += "<strong>Year:</strong> " +
            escapeHtml(video.year) + "<br>";
        }

        if (video.language) {
          html += "<strong>Language:</strong> " +
            escapeHtml(video.language) + "<br>";
        }

        if (video.genre) {
          html += "<strong>Genre:</strong> " +
            escapeHtml(video.genre) + "<br>";
        }

        if (video.caption) {
          html += "<br>" +
            escapeHtml(video.caption);
        }

        details.innerHTML = html;

        loading.classList.add("hidden");
        content.classList.remove("hidden");

        startTimer();

      } catch (error) {

        console.error(error);

        showError(
          "Unable to load this video. Please check the link and try again."
        );
      }
    }

    function startTimer() {

      countdown = 10;

      timerElement.textContent = countdown;

      downloadButton.disabled = true;
      downloadButton.textContent = "Please wait...";

      const timer = setInterval(() => {

        countdown--;

        timerElement.textContent = countdown;

        if (countdown <= 0) {

          clearInterval(timer);

          timerElement.textContent = "✓";

          downloadButton.disabled = false;
          downloadButton.textContent = "📥 Download Video";

          statusElement.textContent =
            "Your download is ready.";

        }

      }, 1000);
    }

    downloadButton.addEventListener("click", () => {

      /*
        IMPORTANT:
        Use the SAME short code that came from the URL.

        The button never uses the latest video.
      */

      const telegramUrl =
        "https://t.me/" +
        BOT_USERNAME +
        "?start=" +
        encodeURIComponent(shortCode);

      window.location.href = telegramUrl;

    });

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

    loadVideo();

  </script>

</body>
</html>
