<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Download</title>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Monetag SDK -->
    <script
        src="//libtl.com/sdk.js"
        data-zone="11903209"
        data-sdk="show_11903209">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            text-align: center;
        }

        .movie-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .info {
            margin-top: 10px;
            line-height: 1.7;
        }

        .info strong {
            display: inline-block;
            min-width: 90px;
        }

        .status {
            margin-top: 20px;
            text-align: center;
            font-size: 15px;
            color: #666;
        }

        .countdown {
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        #downloadBtn {
            display: none;
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #2196f3;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #downloadBtn:active {
            transform: scale(0.98);
        }

        .error {
            color: #d32f2f;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>Video Download</h1>

        <div id="movieTitle" class="movie-title">
            Loading video...
        </div>

        <div id="videoInfo" class="info"></div>

        <div id="status" class="status">
            Loading...
        </div>

        <div id="countdown" class="countdown"></div>

        <button id="downloadBtn" type="button">
            Download
        </button>

        <div id="errorMessage" class="error"></div>

    </div>
</div>
    
<script>
    // ==============================
    // TELEGRAM MINI APP
    // ==============================

    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }


    // ==============================
    // MAKE.COM WEBHOOK
    // ==============================

    const MAKE_WEBHOOK =
        "https://hook.eu1.make.com/ud3xahsh42yybn9byb7pu8i7bzv7i4ra";


    // ==============================
    // BOT
    // ==============================

    const BOT_USERNAME = "Aa_ishh_bot";


    // ==============================
    // GET ELEMENTS
    // ==============================

    const movieTitle =
        document.getElementById("movieTitle");

    const videoInfo =
        document.getElementById("videoInfo");

    const statusText =
        document.getElementById("status");

    const countdownText =
        document.getElementById("countdown");

    const downloadBtn =
        document.getElementById("downloadBtn");

    const errorMessage =
        document.getElementById("errorMessage");


    // ==============================
    // GET SHORT CODE FROM URL
    // ==============================

    const urlParams =
        new URLSearchParams(window.location.search);

    const shortCode =
        urlParams.get("code");


    // This will hold the actual code returned by Make/Neon
    let actualCode = shortCode;


    // ==============================
    // BASIC VALIDATION
    // ==============================

    if (!shortCode) {

        movieTitle.textContent =
            "Video not found";

        statusText.textContent =
            "";

        errorMessage.textContent =
            "No video code was provided.";

    }


    // ==============================
    // HTML ESCAPE
    // ==============================

    function escapeHtml(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    // ==============================
    // FORMAT FILE SIZE
    // ==============================

    function formatFileSize(size) {

        if (
            size === null ||
            size === undefined ||
            size === ""
        ) {
            return "Unknown";
        }

        const number =
            Number(size);

        if (isNaN(number)) {
            return escapeHtml(size);
        }

        if (number < 1024) {
            return number + " B";
        }

        if (number < 1024 * 1024) {
            return (
                (number / 1024).toFixed(1) +
                " KB"
            );
        }

        if (number < 1024 * 1024 * 1024) {
            return (
                (number / (1024 * 1024)).toFixed(2) +
                " MB"
            );
        }

        return (
            (number / (1024 * 1024 * 1024)).toFixed(2) +
            " GB"
        );
    }


    // ==============================
    // QUALITY DETECTION
    // ==============================

    function detectQuality(video) {

        const text = (
            (video.file_name || "") +
            " " +
            (video.caption || "") +
            " " +
            (video.quality || "")
        ).toLowerCase();

        if (text.includes("2160") || text.includes("4k")) {
            return "4K";
        }

        if (text.includes("1440")) {
            return "1440p";
        }

        if (
            text.includes("1080") ||
            text.includes("fhd")
        ) {
            return "1080p";
        }

        if (text.includes("720") ||
            text.includes("hd")) {
            return "720p";
        }

        if (text.includes("480")) {
            return "480p";
        }

        if (video.quality) {
            return video.quality;
        }

        return "Unknown";
    }

    // ==============================
    // DISPLAY VIDEO
    // ==============================

    function displayVideo(video) {

        if (!video) {

            throw new Error(
                "Video data was not found."
            );

        }

        actualCode =
            video.short_code ||
            shortCode;


        const title =
            video.movie_name ||
            video.file_name ||
            "Video";


        const year =
            video.year ||
            "";


        const language =
            video.language ||
            "Unknown";


        const genre =
            video.genre ||
            "Unknown";


        const fileSize =
            formatFileSize(
                video.file_size
            );


        const quality =
            detectQuality(video);


        movieTitle.textContent =
            title +
            (year ? " (" + year + ")" : "");


        videoInfo.innerHTML = `
            <div>
                <strong>Language:</strong>
                ${escapeHtml(language)}
            </div>

            <div>
                <strong>Genre:</strong>
                ${escapeHtml(genre)}
            </div>

            <div>
                <strong>Quality:</strong>
                ${escapeHtml(quality)}
            </div>

            <div>
                <strong>Size:</strong>
                ${escapeHtml(fileSize)}
            </div>
        `;

        statusText.textContent =
            "Preparing download...";

    }


    // ==============================
    // WAIT FOR USER TO RETURN
    // AFTER MONETAG AD
    // ==============================

    function waitForReturnFromAd() {

        return new Promise(function(resolve) {

            let finished = false;

            function finish() {

                if (finished) {
                    return;
                }

                finished = true;

                document.removeEventListener(
                    "visibilitychange",
                    visibilityHandler
                );

                resolve();

            }


            function visibilityHandler() {

                if (
                    document.visibilityState ===
                    "visible"
                ) {
                    finish();
                }

            }


            document.addEventListener(
                "visibilitychange",
                visibilityHandler
            );


            // Fallback in case the ad does not
            // trigger a visibility change.
            setTimeout(function() {
                finish();
            }, 8000);

        });

    }


    // ==============================
    // COUNTDOWN
    // ==============================

    function startCountdown() {

        let seconds = 5;

        downloadBtn.style.display =
            "none";

        countdownText.textContent =
            "Download available in " +
            seconds +
            " seconds";


        const timer =
            setInterval(function() {

                seconds--;

                if (seconds > 0) {

                    countdownText.textContent =
                        "Download available in " +
                        seconds +
                        " seconds";

                    return;
                }


                clearInterval(timer);


                countdownText.textContent =
                    "Download is ready";


                statusText.textContent =
                    "";


                downloadBtn.style.display =
                    "block";

            }, 1000);

    }


    // ==============================
    // SHOW MONETAG AD
    // ==============================

    async function showAdAndStartCountdown() {

        statusText.textContent =
            "Preparing advertisement...";


        // Wait 3 seconds before showing ad
        await new Promise(function(resolve) {

            setTimeout(
                resolve,
                3000
            );

        });


        try {

            if (
                typeof show_11903209 ===
                "function"
            ) {

                show_11903209({

                    type: "inApp",

                    inAppSettings: {

                        frequency: 2,

                        capping: 0.1,

                        interval: 30,

                        timeout: 5,

                        everyPage: false

                    }

                });

            }

        } catch (error) {

            console.log(
                "Monetag error:",
                error
            );

        }


        statusText.textContent =
            "Please return to the app after the advertisement.";


        await waitForReturnFromAd();


        statusText.textContent =
            "Almost ready...";


        startCountdown();

    }


    // ==============================
    // LOAD VIDEO FROM MAKE
    // ==============================

    async function loadVideo() {

        if (!shortCode) {
            return;
        }


        try {

            statusText.textContent =
                "Loading video...";


            const response =
                await fetch(
                    MAKE_WEBHOOK,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            short_code:
                                shortCode
                        })
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Server returned HTTP " +
                    response.status
                );

            }


            const text =
                await response.text();


            if (!text) {

                throw new Error(
                    "Make returned an empty response."
                );

            }


            let data;


            try {

                data =
                    JSON.parse(text);

            } catch (jsonError) {

                console.log(
                    "Raw Make response:",
                    text
                );

                throw new Error(
                    "Make returned invalid JSON."
                );

            }


            console.log(
                "Make response:",
                data
            );


            // Support either:
            // { success:true, video:{...} }
            //
            // or:
            // { videos:[{...}] }

            let video = null;


            if (
                data &&
                data.video
            ) {

                video =
                    data.video;

            } else if (
                data &&
                Array.isArray(data.videos) &&
                data.videos.length > 0
            ) {

                video =
                    data.videos[0];

            } else if (
                Array.isArray(data) &&
                data.length > 0
            ) {

                video =
                    data[0];

            }


            if (!video) {

                throw new Error(
                    "No video was returned for this short code."
                );

            }


            displayVideo(video);


            // Start advertisement process
            await showAdAndStartCountdown();


        } catch (error) {

            console.error(
                "Load video error:",
                error
            );


            movieTitle.textContent =
                "Unable to load video";


            statusText.textContent =
                "";


            errorMessage.textContent =
                error.message ||
                "Something went wrong.";

        }

    }

    // ==============================
    // DOWNLOAD BUTTON
    // ==============================

    downloadBtn.addEventListener(
    "click",
    function () {

        alert("DOWNLOAD BUTTON CLICKED");

        const botLink =
            "https://t.me/" +
            BOT_USERNAME +
            "?start=" +
            encodeURIComponent(actualCode);

        alert(botLink);

        window.Telegram.WebApp.openTelegramLink(botLink);
    }
);


    // ==============================
    // START
    // ==============================

    loadVideo();

</script>

</body>
</html>
