<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Video App</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Monetag -->
    <script src='//libtl.com/sdk.js' data-zone='11903209' data-sdk='show_11903209'></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 18px;
        }

        .header {
            text-align: center;
            padding: 20px 0 10px;
        }

        .logo {
            font-size: 55px;
        }

        h1 {
            margin: 8px 0 5px;
            font-size: 25px;
        }

        .subtitle {
            color: var(--tg-theme-hint-color, #777777);
            margin: 0;
        }

        .search-box {
            width: 100%;
            padding: 14px 16px;
            margin: 20px 0;
            border: none;
            border-radius: 14px;
            background: var(--tg-theme-secondary-bg-color, #f1f1f1);
            color: var(--tg-theme-text-color, #000000);
            font-size: 16px;
            outline: none;
        }

        .search-box:focus {
            outline: 2px solid #2481cc;
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
        }

        #status {
            text-align: center;
            padding: 20px 10px;
            color: var(--tg-theme-hint-color, #777777);
        }

        .video-card {
            background: var(--tg-theme-secondary-bg-color, #f3f3f3);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .video-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .video-info {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #777777);
            line-height: 1.7;
        }

        .count {
            color: var(--tg-theme-hint-color, #777777);
            font-size: 13px;
            margin-bottom: 12px;
        }

        .error {
            color: #d93025;
            background: #ffecec;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            font-size: 14px;
            word-break: break-word;
        }

        .empty {
            text-align: center;
            padding: 30px 10px;
            color: var(--tg-theme-hint-color, #777777);
        }

        .loading {
            text-align: center;
            padding: 25px 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <div class="logo">🎬</div>

        <h1>My Video App V3 TEST</h1>

        <p class="subtitle">
            NEW VERSION 2026
        </p>
    </div>


    <!-- SEARCH -->
    <input
        type="text"
        id="searchInput"
        class="search-box"
        placeholder="🔎 Search videos..."
        autocomplete="off"
    >


    <!-- SECTION -->
    <div class="section-title">
        Latest Videos
    </div>


    <!-- COUNT -->
    <div id="count" class="count"></div>


    <!-- STATUS -->
    <div id="status" class="loading">
        ⏳ Loading videos...
    </div>


    <!-- VIDEO LIST -->
    <div id="videoList"></div>

</div>


<script>

    // ==================================================
    // TELEGRAM MINI APP
    // ==================================================

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    // ==================================================
    // MAKE.COM WEBHOOK
    // ==================================================

    const MAKE_WEBHOOK_URL =
        "https://hook.eu1.make.com/ud3xahsh42yybn9byb7pu8i7bzv7i4ra";


    // ==================================================
    // VARIABLES
    // ==================================================

    let allVideos = [];


    // ==================================================
    // LOAD VIDEOS FROM MAKE
    // ==================================================

    async function loadVideos() {

        const status =
            document.getElementById("status");


        status.innerHTML =
            "⏳ Loading videos...";


        try {

            // Telegram user information
            const telegramUser =
                tg.initDataUnsafe &&
                tg.initDataUnsafe.user
                    ? tg.initDataUnsafe.user
                    : null;


            // Send request to Make
            const response =
                await fetch(
                    MAKE_WEBHOOK_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
    short_code: "dae2c6ce"
})
                        })
                    }
                );


            console.log(
                "Make HTTP status:",
                response.status
            );


            // Check HTTP status
            if (!response.ok) {

                throw new Error(
                    "Make.com returned HTTP " +
                    response.status
                );

            }


            // Read response as text first
            const responseText =
                await response.text();


            console.log(
                "Raw Make response:",
                responseText
            );


            if (!responseText) {

                throw new Error(
                    "Make.com returned an empty response."
                );

            }


            // Parse JSON manually
            let data;

            try {

                data =
                    JSON.parse(responseText);

            } catch (error) {

                console.error(
                    "JSON parse error:",
                    error
                );

                throw new Error(
                    "Make.com returned invalid JSON."
                );

            }


            console.log(
                "Parsed Make response:",
                data
            );


            // Check success
            if (data.success !== true) {

                throw new Error(
                    "Make.com response success was not true."
                );

            }


            // Check videos array
            if (!Array.isArray(data.videos)) {

                throw new Error(
                    "The videos field is not an array."
                );

            }


            // Store videos
            allVideos =
                data.videos;


            console.log(
                "Number of videos:",
                allVideos.length
            );


            // Clear loading message
            status.innerHTML = "";


            // Display videos
            renderVideos(allVideos);


            // ==================================================
            // MONETAG AD
            // ==================================================

            setTimeout(() => {

                showMonetagAd();

            }, 1000);


        } catch (error) {

            console.error(
                "Mini App error:",
                error
            );


            status.innerHTML = `
                <div class="error">
                    ❌ Unable to load videos.
                    <br><br>
                    ${escapeHTML(error.message)}
                </div>
            `;


            document.getElementById(
                "count"
            ).textContent = "";

        }

    }


    // ==================================================
    // RENDER VIDEOS
    // ==================================================

    function renderVideos(videos) {

        const videoList =
            document.getElementById(
                "videoList"
            );


        const count =
            document.getElementById(
                "count"
            );


        videoList.innerHTML = "";


        // Count
        count.textContent =
            videos.length +
            (
                videos.length === 1
                    ? " video"
                    : " videos"
            );


        // Empty
        if (videos.length === 0) {

            videoList.innerHTML = `
                <div class="empty">
                    No videos found.
                </div>
            `;

            return;

        }


        // Create cards
        videos.forEach(
            (video) => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "video-card";


                // Title
                const title =
                    video.movie_name ||
                    video.file_name ||
                    "Untitled Video";


                // Other information
                const year =
                    video.year || "";


                const language =
                    video.language || "";


                const genre =
                    video.genre || "";


                const fileSize =
                    video.file_size || "";


                const shortCode =
                    video.short_code || "";


                let info = "";


                if (year) {

                    info +=
                        "📅 " +
                        escapeHTML(
                            String(year)
                        ) +
                        "<br>";

                }


                if (language) {

                    info +=
                        "🌐 " +
                        escapeHTML(
                            String(language)
                        ) +
                        "<br>";

                }


                if (genre) {

                    info +=
                        "🎭 " +
                        escapeHTML(
                            String(genre)
                        ) +
                        "<br>";

                }


                if (fileSize) {

                    info +=
                        "💾 " +
                        escapeHTML(
                            String(fileSize)
                        ) +
                        "<br>";

                }


                if (shortCode) {

                    info +=
                        "🔑 " +
                        escapeHTML(
                            String(shortCode)
                        );

                }


                if (!info) {

                    info =
                        "Video content";

                }


                card.innerHTML = `

                    <div class="video-title">
                        ${escapeHTML(
                            String(title)
                        )}
                    </div>

                    <div class="video-info">
                        ${info}
                    </div>

                `;


                videoList.appendChild(
                    card
                );

            }
        );

    }


    // ==================================================
    // SEARCH
    // ==================================================

    document
        .getElementById("searchInput")
        .addEventListener(
            "input",
            function () {

                const search =
                    this.value
                        .toLowerCase()
                        .trim();


                // Show everything
                if (!search) {

                    renderVideos(
                        allVideos
                    );

                    return;

                }


                // Filter
                const filtered =
                    allVideos.filter(
                        (video) => {

                            const searchableText = [

                                video.movie_name,
                                video.file_name,
                                video.language,
                                video.genre,
                                video.year,
                                video.caption,
                                video.short_code

                            ]
                            .filter(Boolean)
                            .join(" ")
                            .toLowerCase();


                            return searchableText
                                .includes(search);

                        }
                    );


                renderVideos(
                    filtered
                );

            }
        );


    // ==================================================
    // HTML ESCAPE
    // ==================================================

    function escapeHTML(value) {

        return value
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    // ==================================================
    // MONETAG
    // ==================================================

    function showMonetagAd() {

        try {

            if (
                typeof show_11903209 ===
                "function"
            ) {

                console.log(
                    "Requesting Monetag ad..."
                );


                show_11903209({

                    type: "inApp",

                    inAppSettings: {

                        frequency: 2,

                        capping: 0.1,

                        interval: 30,

                        timeout: 5,

                        everyPage: false

                    }

                });

            } else {

                console.log(
                    "Monetag SDK is not available yet."
                );

            }

        } catch (error) {

            console.error(
                "Monetag error:",
                error
            );

        }

    }


    // ==================================================
    // START APPLICATION
    // ==================================================

    loadVideos();

</script>

</body>
</html>
