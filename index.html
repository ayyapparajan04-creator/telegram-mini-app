<!DOCTYPE html>
<html lang="en">
<head>

    <script src='//libtl.com/sdk.js' data-zone='11903209' data-sdk='show_11903209'></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Video App</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }

        .app {
            max-width: 600px;
            margin: auto;
            padding: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            font-size: 32px;
        }

        .brand-name {
            font-size: 20px;
            font-weight: bold;
        }

        .search {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 12px;
            outline: none;
            background: var(
                --tg-theme-secondary-bg-color,
                #f2f2f2
            );
            color: var(--tg-theme-text-color, #000000);
            font-size: 16px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .video-card {
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 14px;
            background: var(
                --tg-theme-secondary-bg-color,
                #f2f2f2
            );
        }

        .video-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .video-info {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #777777);
            margin-bottom: 12px;
        }

        .watch-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--tg-theme-hint-color, #777777);
        }
    </style>

</head>

<body>

<div class="app">

    <div class="header">
        <div class="brand">
            <div class="brand-icon">🎬</div>
            <div class="brand-name">My Video App</div>
        </div>
    </div>

    <input
        type="search"
        class="search"
        placeholder="Search videos..."
        id="searchInput"
    >

    <div class="section-title">
        Latest Videos
    </div>

    <div id="videoList">

        <div class="video-card">

            <div class="video-title">
                Your Video
            </div>

            <div class="video-info">
                New upload • Tamil
            </div>

            <button class="watch-button">
                ▶ Watch
            </button>

        </div>

        <div class="video-card">

            <div class="video-title">
                Another Video
            </div>

            <div class="video-info">
                Featured • Tamil
            </div>

            <button class="watch-button">
                ▶ Watch
            </button>

        </div>

    </div>

</div>


<script>

    // Telegram Mini App
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    // Search
    const searchInput = document.getElementById("searchInput");
    const videoCards = document.querySelectorAll(".video-card");

    searchInput.addEventListener("input", function () {

        const searchText =
            this.value.toLowerCase().trim();

        videoCards.forEach(function (card) {

            const title =
                card.querySelector(".video-title")
                    .textContent
                    .toLowerCase();

            card.style.display =
                title.includes(searchText)
                    ? "block"
                    : "none";

        });

    });


    // Monetag In-App Interstitial
    show_11903209({
        type: "inApp",
        inAppSettings: {
            frequency: 2,
            capping: 0.1,
            interval: 30,
            timeout: 5,
            everyPage: false
        }
    });

</script>

</body>
</html>
