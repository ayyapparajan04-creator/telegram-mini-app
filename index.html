<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Video App</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script src='//libtl.com/sdk.js' data-zone='11903209' data-sdk='show_11903209'></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }

        .app {
            max-width: 600px;
            margin: auto;
            padding: 16px;
        }

        .header {
            text-align: center;
            padding: 20px 0;
        }

        .logo {
            font-size: 45px;
        }

        h1 {
            margin: 8px 0;
            font-size: 24px;
        }

        .subtitle {
            color: var(--tg-theme-hint-color, #777);
            font-size: 14px;
        }

        .search {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: var(--tg-theme-secondary-bg-color, #f1f1f1);
            color: var(--tg-theme-text-color, #000);
            font-size: 16px;
            outline: none;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        #status {
            text-align: center;
            padding: 20px;
            color: var(--tg-theme-hint-color, #777);
        }

        .video-card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .video-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .video-info {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #777);
            line-height: 1.6;
        }

        .video-code {
            display: inline-block;
            margin-top: 10px;
            padding: 7px 10px;
            border-radius: 8px;
            background: var(--tg-theme-bg-color, #fff);
            font-size: 12px;
        }

        .empty {
            text-align: center;
            padding: 30px 10px;
            color: var(--tg-theme-hint-color, #777);
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">🎬</div>
        <h1>My Video App</h1>
        <div class="subtitle">Latest videos</div>
    </div>

    <input
        type="text"
        id="search"
        class="search"
        placeholder="🔎 Search videos..."
    >

    <div class="section-title">
        Latest Videos
    </div>

    <div id="status">
        Loading videos...
    </div>

    <div id="videos"></div>

</div>

<script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    // Your NEW Make.com webhook
    const MAKE_WEBHOOK_URL = "https://hook.eu1.make.com/ud3xahsh42yybn9byb7pu8i7bzv7i4ra";

    let allVideos = [];

    async function loadVideos() {

        const status = document.getElementById("status");
        const videosContainer = document.getElementById("videos");

        try {

            const response = await fetch(MAKE_WEBHOOK_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    source: "telegram_mini_app",
                    telegram_user: tg.initDataUnsafe?.user || null
                })
            });

            if (!response.ok) {
                throw new Error("Make.com request failed");
            }

            const data = await response.json();

            console.log("Make.com response:", data);

            if (!data.success) {
                throw new Error("Make.com returned an error");
            }

            allVideos = data.videos || [];

            status.style.display = "none";

            renderVideos(allVideos);

        } catch (error) {

            console.error(error);

            status.innerHTML =
                "❌ Unable to load videos.<br><br>" +
                "Please try again later.";

        }
    }


    function renderVideos(videos) {

        const container = document.getElementById("videos");

        container.innerHTML = "";

        if (!videos || videos.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    No videos found.
                </div>
            `;

            return;
        }


        videos.forEach(video => {

            const card = document.createElement("div");

            card.className = "video-card";

            card.innerHTML = `

                <div class="video-title">
                    ${escapeHTML(video.movie_name || video.file_name || "Untitled Video")}
                </div>

                <div class="video-info">

                    ${video.year ? `📅 Year: ${escapeHTML(video.year)}<br>` : ""}

                    ${video.language ? `🌐 Language: ${escapeHTML(video.language)}<br>` : ""}

                    ${video.genre ? `🎭 Genre: ${escapeHTML(video.genre)}<br>` : ""}

                    ${video.file_size ? `💾 Size: ${escapeHTML(video.file_size)}<br>` : ""}

                    ${video.caption ? `📝 ${escapeHTML(video.caption)}` : ""}

                </div>

                ${
                    video.short_code
                    ? `<div class="video-code">Code: ${escapeHTML(video.short_code)}</div>`
                    : ""
                }

            `;

            container.appendChild(card);

        });
    }


    document.getElementById("search").addEventListener("input", function () {

        const query = this.value.toLowerCase().trim();

        if (!query) {

            renderVideos(allVideos);

            return;
        }

        const filtered = allVideos.filter(video => {

            const text = [

                video.movie_name,
                video.file_name,
                video.language,
                video.genre,
                video.year,
                video.caption,
                video.short_code

            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();

            return text.includes(query);

        });

        renderVideos(filtered);

    });


    function escapeHTML(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // Load videos
    loadVideos();


    // Monetag In-App Interstitial
    

// In-App Interstitial

show_11903209({
  type: 'inApp',
  inAppSettings: {
    frequency: 2,
    capping: 0.1,
    interval: 30,
    timeout: 5,
    everyPage: false
  }
})

/*
This value is decoded as follows:
- show automatically 2 ads
  within 0.1 hours (6 minutes)
  with a 30-second interval between them
  and a 5-second delay before the first one is shown.
  The last digit, 0, means that the session will be saved when you navigate between pages.
  If you set the last digit as 1, then at any transition between pages,
  the session will be reset, and the ads will start again.
*/



</script>

</body>
</html>
