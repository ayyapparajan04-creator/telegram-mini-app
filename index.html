<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Video Download</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Monetag -->
    <script
        src="//libtl.com/sdk.js"
        data-zone="11903209"
        data-sdk="show_11903209">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #111827;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        .card {
            background: #1f2937;
            border-radius: 16px;
            padding: 20px;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .movie-title {
            font-size: 20px;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 18px;
            text-align: center;
        }

        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .info-item {
            background: #374151;
            border-radius: 10px;
            padding: 12px;
        }

        .label {
            color: #9ca3af;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .value {
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            word-break: break-word;
        }

        .countdown {
            text-align: center;
            margin-top: 25px;
            font-size: 15px;
            color: #d1d5db;
            min-height: 22px;
        }

        #downloadBtn {
            display: none;
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #22c55e;
            color: #ffffff;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #downloadBtn:active {
            transform: scale(0.98);
        }

        .error {
            display: none;
            margin-top: 20px;
            padding: 14px;
            background: #7f1d1d;
            border-radius: 10px;
            color: #fecaca;
            text-align: center;
        }

        @media (max-width: 400px) {
            .container {
                padding: 14px;
            }

            .info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="title">
            Video Download
        </div>

        <div
            id="movieTitle"
            class="movie-title">
            Loading...
        </div>

        <div class="info">

            <div class="info-item">
                <div class="label">Size</div>
                <div
                    id="fileSize"
                    class="value">
                    -
                </div>
            </div>

            <div class="info-item">
                <div class="label">Language</div>
                <div
                    id="language"
                    class="value">
                    -
                </div>
            </div>

            <div class="info-item">
                <div class="label">Quality</div>
                <div
                    id="quality"
                    class="value">
                    -
                </div>
            </div>

            <div class="info-item">
                <div class="label">Year</div>
                <div
                    id="year"
                    class="value">
                    -
                </div>
            </div>

            <div class="info-item">
                <div class="label">Genre</div>
                <div
                    id="genre"
                    class="value">
                    -
                </div>
            </div>

        </div>

        <div
            id="countdown"
            class="countdown">
        </div>

        <button
            id="downloadBtn"
            type="button">
            Download
        </button>

        <div
            id="errorMessage"
            class="error">
        </div>

    </div>

</div>


<script>

    /* =========================================
       CONFIGURATION
    ========================================= */

    const MAKE_WEBHOOK =
        "https://hook.eu1.make.com/ud3xahsh42yybn9byb7pu8i7bzv7i4ra";

    const BOT_USERNAME =
        "Aa_ishh_bot";


    /* =========================================
       TELEGRAM
    ========================================= */

    if (
        window.Telegram &&
        window.Telegram.WebApp
    ) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }


    /* =========================================
       ELEMENTS
    ========================================= */

    const movieTitle =
        document.getElementById("movieTitle");

    const fileSize =
        document.getElementById("fileSize");

    const language =
        document.getElementById("language");

    const quality =
        document.getElementById("quality");

    const year =
        document.getElementById("year");

    const genre =
        document.getElementById("genre");

    const countdown =
        document.getElementById("countdown");

    const downloadBtn =
        document.getElementById("downloadBtn");

    const errorMessage =
        document.getElementById("errorMessage");


    /* =========================================
       GET SHORT CODE
    ========================================= */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const shortCode =
        params.get("code");

    let actualCode =
        shortCode;


    /* =========================================
       HELPER
    ========================================= */

    function cleanValue(value) {

        if (
            value === undefined ||
            value === null
        ) {
            return "";
        }

        if (
            typeof value === "string"
        ) {

            const cleaned =
                value.trim();

            if (
                cleaned === "" ||
                cleaned.toLowerCase() === "null" ||
                cleaned.toLowerCase() === "undefined"
            ) {
                return "";
            }

            return cleaned;
        }

        return String(value);
    }


    function getField(obj, names) {

        if (
            !obj ||
            typeof obj !== "object"
        ) {
            return "";
        }

        for (const name of names) {

            if (
                obj[name] !== undefined &&
                obj[name] !== null &&
                cleanValue(obj[name]) !== ""
            ) {

                return cleanValue(
                    obj[name]
                );
            }
        }


        const keys =
            Object.keys(obj);


        for (const wanted of names) {

            const found =
                keys.find(
                    key =>
                        key.toLowerCase() ===
                        wanted.toLowerCase()
                );

            if (found) {

                const value =
                    cleanValue(
                        obj[found]
                    );

                if (value !== "") {
                    return value;
                }
            }
        }

        return "";
    }


    /* =========================================
       DISPLAY VIDEO
    ========================================= */

    function displayVideo(video) {

        if (!video) {

            showError(
                "Video not found."
            );

            return;
        }


        const movie =
            getField(video, [
                "movie_name",
                "movieName",
                "movie",
                "title",
                "file_name",
                "fileName"
            ]);

        movieTitle.textContent =
            movie || "Video Download";


        const size =
            getField(video, [
                "file_size",
                "fileSize",
                "size"
            ]);

        fileSize.textContent =
            size || "-";


        const lang =
            getField(video, [
                "language",
                "lang",
                "movie_language",
                "audio_language",
                "audioLanguage"
            ]);

        language.textContent =
            lang || "-";


        let videoQuality =
            getField(video, [
                "quality",
                "video_quality",
                "videoQuality",
                "resolution"
            ]);


        if (!videoQuality) {

            const caption =
                getField(video, [
                    "caption"
                ]);

            if (caption) {

                const qualityMatch =
                    caption.match(
                        /\b(4K|2160p|1440p|1080p|720p|480p|360p|HD|FHD|WEB-DL|WEBRip|BluRay)\b/i
                    );

                if (qualityMatch) {

                    videoQuality =
                        qualityMatch[1];
                }
            }
        }


        quality.textContent =
            videoQuality || "-";


        const videoYear =
            getField(video, [
                "year",
                "release_year",
                "releaseYear"
            ]);

        year.textContent =
            videoYear || "-";


        const videoGenre =
            getField(video, [
                "genre",
                "genres"
            ]);

        genre.textContent =
            videoGenre || "-";


        const returnedCode =
            getField(video, [
                "short_code",
                "shortCode",
                "code"
            ]);

        if (returnedCode) {
            actualCode =
                returnedCode;
        }
    }


    /* =========================================
       ERROR
    ========================================= */

    function showError(message) {

        errorMessage.textContent =
            message;

        errorMessage.style.display =
            "block";

        movieTitle.textContent =
            "Video Download";

        countdown.textContent =
            "";

        downloadBtn.style.display =
            "none";
    }

    /* =========================================
       LOAD VIDEO FROM MAKE
    ========================================= */

    async function loadVideo() {

        if (!shortCode) {

            showError(
                "No video code was provided."
            );

            return;
        }


        try {

            const response =
                await fetch(
                    MAKE_WEBHOOK,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            short_code:
                                shortCode
                        })
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Request failed"
                );
            }


            const text =
                await response.text();


            let data;

            try {

                data =
                    JSON.parse(text);

            } catch (e) {

                throw new Error(
                    "Invalid response"
                );
            }


            let video = null;


            if (
                data &&
                data.video &&
                typeof data.video === "object"
            ) {

                video =
                    data.video;

            } else if (
                data &&
                Array.isArray(data.videos) &&
                data.videos.length > 0
            ) {

                video =
                    data.videos[0];

            } else if (
                data &&
                Array.isArray(data.data) &&
                data.data.length > 0
            ) {

                video =
                    data.data[0];

            } else if (
                data &&
                typeof data === "object" &&
                (
                    data.movie_name ||
                    data.movieName ||
                    data.file_name ||
                    data.short_code ||
                    data.shortCode ||
                    data.language ||
                    data.file_size
                )
            ) {

                video =
                    data;
            }


            if (!video) {

                showError(
                    "Video not found."
                );

                return;
            }


            displayVideo(video);


            startAdProcess();


        } catch (error) {

            showError(
                "Unable to load the video."
            );
        }
    }


    /* =========================================
       MONETAG
    ========================================= */

    function startAdProcess() {

        setTimeout(() => {

            try {

                if (
                    typeof show_11903209 ===
                    "function"
                ) {

                    show_11903209({

                        type: "inApp",

                        inAppSettings: {

                            frequency: 2,

                            capping: 0.1,

                            interval: 30,

                            timeout: 5,

                            everyPage: false
                        }

                    });
                }

            } catch (error) {
                // Continue normally if ad fails
            }


            waitForReturn();

        }, 3000);
    }


    /* =========================================
       WAIT FOR RETURN
    ========================================= */

    function waitForReturn() {

        let countdownStarted =
            false;

        let fallbackTimer;


        function startCountdownOnce() {

            if (countdownStarted) {
                return;
            }

            countdownStarted =
                true;

            clearTimeout(
                fallbackTimer
            );

            document.removeEventListener(
                "visibilitychange",
                visibilityHandler
            );

            startCountdown();
        }


        function visibilityHandler() {

            if (
                document.visibilityState ===
                "visible"
            ) {

                startCountdownOnce();
            }
        }


        document.addEventListener(
            "visibilitychange",
            visibilityHandler
        );


        fallbackTimer =
            setTimeout(
                startCountdownOnce,
                8000
            );
    }


    /* =========================================
       COUNTDOWN
    ========================================= */

    function startCountdown() {

        let remaining = 5;


        countdown.textContent =
            "Download available in " +
            remaining +
            " seconds";


        const timer =
            setInterval(() => {

                remaining--;


                if (remaining > 0) {

                    countdown.textContent =
                        "Download available in " +
                        remaining +
                        " seconds";

                } else {

                    clearInterval(timer);

                    countdown.textContent =
                        "";

                    downloadBtn.style.display =
                        "block";
                }

            }, 1000);
    }


    /* =========================================
       DOWNLOAD
    ========================================= */

    downloadBtn.addEventListener(
        "click",
        function () {

            if (!actualCode) {
                return;
            }


            const botLink =
                "https://t.me/" +
                BOT_USERNAME +
                "?start=" +
                encodeURIComponent(
                    actualCode
                );


            if (
                window.Telegram &&
                window.Telegram.WebApp &&
                typeof window.Telegram.WebApp.openTelegramLink ===
                "function"
            ) {

                window.Telegram.WebApp.openTelegramLink(
                    botLink
                );

            } else {

                window.location.href =
                    botLink;
            }
        }
    );


    /* =========================================
       START
    ========================================= */

    loadVideo();

</script>

</body>
</html>
